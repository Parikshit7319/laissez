# Weekly dependency updates. Minor and patch updates arrive as one pull request per ecosystem so they stay reviewable.
# Major versions are not proposed here: a major bump (TypeScript, Preact, esbuild) needs a deliberate migration, so review
# them by hand once a quarter. Security advisories open a pull request at once regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    ignore: [{ dependency-name: '*', update-types: ['version-update:semver-major'] }]
    groups: { minor-and-patch: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /api
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    ignore: [{ dependency-name: '*', update-types: ['version-update:semver-major'] }]
    groups: { minor-and-patch: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /api/jobs
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    ignore: [{ dependency-name: '*', update-types: ['version-update:semver-major'] }]
    groups: { minor-and-patch: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /api/chain
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    ignore: [{ dependency-name: '*', update-types: ['version-update:semver-major'] }]
    groups: { minor-and-patch: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore: [{ dependency-name: '*', update-types: ['version-update:semver-major'] }]
    groups: { minor-and-patch: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore: [{ dependency-name: '*', update-types: ['version-update:semver-major'] }]
  - package-ecosystem: pip
    directory: /sdk/python
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore: [{ dependency-name: '*', update-types: ['version-update:semver-major'] }]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups: { actions: { patterns: ['*'] } }
