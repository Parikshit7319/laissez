# Weekly dependency updates. Minor and patch updates arrive as one pull request per ecosystem so they stay reviewable;
# a major version gets its own pull request. Security advisories open a pull request at once regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups: { minor-and-patch: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /api
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups: { minor-and-patch: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /api/jobs
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups: { minor-and-patch: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /api/chain
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups: { minor-and-patch: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups: { minor-and-patch: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
  - package-ecosystem: pip
    directory: /sdk/python
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups: { actions: { patterns: ['*'] } }
