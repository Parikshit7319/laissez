name: Security

# Three independent checks, none of which gate the deploy (deploy.yml calls ci.yml only), so a new advisory never blocks
# a fix from shipping. They run on every pull request and push to main, and weekly, because advisories appear without a commit.
#   secrets   gitleaks over the full git history, with allowlist in .gitleaks.toml
#   audit     npm audit on what ships: the site, the Worker and the scheduled jobs (production dependencies, high and above)
#   codeql    static analysis of the TypeScript and Python in the repository

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Site
        run: npm audit --omit=dev --audit-level=high
      - name: Worker
        working-directory: api
        run: npm audit --omit=dev --audit-level=high
      - name: Scheduled jobs
        working-directory: api/jobs
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
