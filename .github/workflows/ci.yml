name: CI

# Runs on every pull request and on branches other than main. Pushes to main run it through deploy.yml,
# which calls this workflow and only builds the site once it passes.
#
# Secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN     Workers Scripts: Edit on the account. Enables the Worker preview and smoke test.
#   CLOUDFLARE_ACCOUNT_ID    Account that owns laissez-api.
# Variables (optional):
#   E2E_BASE_URL             Site to run the Playwright flows against. Leave unset to skip them except on dispatch.

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
    inputs:
      run_e2e:
        description: Run the Playwright browser flows
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run the Playwright browser flows against E2E_BASE_URL (or the live site)
        type: boolean
        default: false
      e2e_base_url:
        description: Site to test, with trailing slash
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            api/jobs/package-lock.json
            tests/e2e/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix api --no-audit --no-fund
          npm ci --prefix api/jobs --no-audit --no-fund

      - name: Engine tests
        run: npm test

      - name: Rule pack regression
        run: npm run test:rules

      - name: OpenAPI document matches the routes
        run: npm run test:openapi

      - name: TypeScript SDK
        run: |
          npx --prefix api/jobs tsx sdk/typescript/test.ts
          npx --prefix api tsc -p sdk/typescript/tsconfig.json

      - name: Python SDK
        working-directory: sdk/python
        run: python3 -m unittest discover -s tests -v

      - name: Jobs
        working-directory: api
        run: |
          npx --prefix jobs tsx jobs/__tests__/parsers.test.ts
          npx --prefix jobs tsx jobs/__tests__/monitor.test.ts

      - name: API typecheck
        working-directory: api
        run: npx tsc --noEmit

      - name: Migrations apply on a fresh database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/laissez
          LAISSEZ_RT_PASSWORD: ci
        run: |
          docker run -d --name laissez-ci-db -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=laissez -p 5432:5432 postgres:17
          for i in $(seq 1 30); do docker exec laissez-ci-db pg_isready -U postgres -d laissez && break; sleep 1; done
          npm install --prefix api --no-save --no-audit --no-fund pg
          node api/db/setup.mjs
          node api/db/setup.mjs   # second run must be a no-op
          docker rm -f laissez-ci-db

      - name: Site build
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 3

  preview:
    name: Worker preview and smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Secrets are not exposed to pull requests from forks; the job then reports a notice and succeeds.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Worker preview skipped::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not available to this run, so no preview was uploaded and the smoke test did not run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        if: steps.creds.outputs.present == 'true'
        working-directory: api
        run: npm ci --no-audit --no-fund

      # A version upload does not change traffic: production keeps serving the active deployment.
      # The preview URL serves this commit with the production bindings and secrets.
      - name: Upload a Worker version
        if: steps.creds.outputs.present == 'true'
        id: upload
        working-directory: api
        run: |
          set -o pipefail
          npx wrangler versions upload --message "ci ${GITHUB_SHA::7} ${GITHUB_REF_NAME}" --tag "ci-${GITHUB_SHA::7}" 2>&1 | tee upload.log
          URL=$(grep -oE 'https://[a-z0-9-]+-laissez-api\.[a-z0-9-]+\.workers\.dev' upload.log | head -1)
          if [ -z "$URL" ]; then
            echo "::error::Could not find the Version Preview URL in the wrangler output."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test against the preview
        if: steps.creds.outputs.present == 'true'
        run: node api/test/smoke.mjs "${{ steps.upload.outputs.url }}"

  e2e:
    name: Browser flows (Playwright)
    needs: test
    if: ${{ inputs.run_e2e || vars.E2E_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: ${{ inputs.e2e_base_url || vars.E2E_BASE_URL || 'https://parikshit7319.github.io/laissez/' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install Playwright
        run: |
          npm ci --prefix tests/e2e --no-audit --no-fund
          npx --prefix tests/e2e playwright install --with-deps chromium
      - name: Run flows
        run: npx --prefix tests/e2e playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            tests/e2e/report
            tests/e2e/results
          retention-days: 7
