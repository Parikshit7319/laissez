# Local Postgres for the Laissez API. Postgres 17 ships pg_trgm in contrib, which migrate-002 enables.
#
#   docker compose up -d
#   DATABASE_URL=postgres://postgres:laissez@127.0.0.1:5432/laissez LAISSEZ_RT_PASSWORD=laissez_rt node api/db/setup.mjs
#
# Then in api/.dev.vars:
#   DATABASE_URL=postgres://postgres:laissez@127.0.0.1:5432/laissez
#   DATABASE_URL_TENANT=postgres://laissez_rt:laissez_rt@127.0.0.1:5432/laissez
#
# Node scripts (setup.mjs, jobs, chain tests) connect to Postgres directly on 5432. The Worker itself uses
# @neondatabase/serverless, which speaks HTTP or WebSocket, not the Postgres wire protocol, so `wrangler dev`
# against this database needs the optional "neon-proxy" service (profile "worker") and the driver pointed at it.
# See docs/runbook.md, "Local setup", for the two ways to run the API locally.
services:
  db:
    image: postgres:17
    container_name: laissez-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: laissez
      POSTGRES_DB: laissez
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "log_min_duration_statement=250"]
    volumes:
      - laissez-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d laissez"]
      interval: 5s
      timeout: 3s
      retries: 20

  # WebSocket proxy so the Neon serverless driver inside `wrangler dev` can reach the local database.
  # Optional: node scripts (jobs, setup.mjs, chain tests) connect to db directly on 5432.
  neon-proxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    container_name: laissez-neon-proxy
    environment:
      APPEND_PORT: "db:5432"
      ALLOW_ADDR_REGEX: ".*"
      LOG_TRAFFIC: "false"
    ports:
      - "5433:80"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["worker"]

volumes:
  laissez-pgdata:
